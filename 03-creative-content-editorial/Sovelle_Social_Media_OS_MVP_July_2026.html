<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovelle Content OS</title>
<style>
:root{
  --paper:#fffdfb; --cream:#f6f0eb; --ink:#292321; --muted:#776d68;
  --blush:#ead9d2; --rose:#ab7569; --green:#dce9d8; --yellow:#fff0c9;
  --blue:#dfe8f1; --red:#f3d4d0; --line:#e8ddd5; --white:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman","Songti SC",serif;font-weight:400}
a{color:var(--rose)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid #eee3da;border-radius:9px;padding:12px 16px;width:100%;line-height:1.5;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:#d9cabf}
textarea{resize:vertical;min-height:80px;line-height:1.7;padding:13px 16px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--rose);outline-offset:1px}
label{display:block;font-size:11.5px;letter-spacing:.05em;color:var(--muted);margin:22px 0 9px;text-transform:uppercase}
label .zh{text-transform:none;letter-spacing:0}

/* ---- top nav ---- */
.topbar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);padding:0 22px;display:flex;align-items:center;gap:26px;height:58px}
.brand{font-family:Georgia,serif;font-size:21px;letter-spacing:.12em}
.brand small{font-family:Inter,sans-serif;font-size:10px;letter-spacing:.18em;color:var(--muted);display:block;margin-top:-2px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{background:none;border:none;padding:8px 13px;border-radius:999px;font-size:13.5px;color:var(--muted);white-space:nowrap}
nav button.on{background:var(--ink);color:var(--paper)}
nav button .n{display:inline-block;min-width:17px;padding:0 4px;margin-left:5px;border-radius:999px;background:var(--rose);color:#fff;font-size:10.5px;line-height:16px;text-align:center}
.topbar .right{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 13px;font-size:13px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.rose{background:var(--rose);color:#fff;border-color:var(--rose)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:#9c4438;border-color:#e5c2bb;background:var(--white)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---- layout ---- */
main{max-width:1240px;margin:0 auto;padding:24px 22px 90px}
.two{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px}
.panel .hd{padding:16px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel .hd h3{font-size:16px}
.panel .bd{padding:24px 28px 26px}
.pad0 .bd{padding:0}
.pad0 .bd.pad{padding:26px 30px 30px}

/* ---- pills / chips / status ---- */
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--muted)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;border:1px solid transparent}
.chip.sku{background:var(--blue);cursor:pointer;border-color:transparent}
.chip.sku.on{background:var(--ink);color:var(--paper)}
.chip.sku.sample{background:var(--red)}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;background:var(--cream);color:var(--muted)}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;white-space:nowrap}
.st.s0,.st.s1{background:var(--cream);color:var(--muted)}
.st.s2{background:var(--blue)}
.st.s3{background:var(--yellow)}
.st.s4,.st.s5{background:var(--blush)}
.st.s6{background:var(--green)}
.st.s7{background:var(--blue)}
.st.s8{background:var(--ink);color:var(--paper)}
.st.s9{background:var(--green);border:1px solid #b9cfae}
.badge-sample{background:var(--red);color:#7c3b30;border-radius:5px;padding:1px 7px;font-size:10.5px;letter-spacing:.03em}
.founder{background:var(--yellow);border-radius:5px;padding:1px 7px;font-size:10.5px}

/* ---- platform board ---- */
.pb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
.pb-col{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pb-col>.ph{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between}
.pb-col>.ph h3{font-size:17px}
.pb-col>.ph .kv{font-size:11.5px}
.pb-sec{padding:9px 18px 4px;font-size:11px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.pb-sec.hot{color:#8a4437}
.pb-item{margin:0 12px 8px;padding:9px 11px;border:1px solid #f0e7df;border-radius:9px;cursor:pointer;background:var(--paper)}
.pb-item:hover{border-color:var(--rose)}
.pb-item .l1{display:flex;gap:8px;align-items:center}
.pb-item .l1 .id{font-family:Georgia,serif;font-size:12px;color:var(--rose)}
.pb-item .l1 .t{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-item .l2{margin-top:4px;font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pb-item.hot{background:var(--yellow);border-color:#ecd9a8}
.pb-empty{margin:0 12px 10px;padding:10px;border:1px dashed var(--line);border-radius:9px;font-size:11.5px;color:var(--muted);text-align:center}
.pb-foot{padding:6px 18px 14px}
@media (max-width:920px){.pb{grid-template-columns:1fr}}
/* ---- workbench ---- */
.wb-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.wb-head h1{font-size:30px}
.wb-head .date{color:var(--muted);font-size:13px}
.queues{display:flex;flex-direction:column;gap:14px}
.queue{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.queue>.qh{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.queue>.qh .num{font-family:Georgia,serif;font-size:24px;color:var(--rose);min-width:30px}
.queue>.qh h3{font-size:16px;flex:1}
.queue>.qh .hint{font-size:12px;color:var(--muted)}
.qitem{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #f2eae3;flex-wrap:wrap}
.qitem:last-child{border-bottom:none}
.qitem .id{font-family:Georgia,serif;font-size:13px;color:var(--rose);min-width:66px}
.qitem .t{flex:1;min-width:160px}
.qitem .meta{font-size:12px;color:var(--muted)}
.qempty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.wb-side{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:20px}
.cov td{padding:3px 8px 3px 0;font-size:12.5px;color:var(--muted)}
.cov td:last-child{color:var(--ink)}
.learn-line{padding:8px 0;border-bottom:1px solid #f2eae3;font-size:12.5px}
.learn-line:last-child{border-bottom:none}
.allclear{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:46px;text-align:center}
.allclear h2{font-size:22px;margin-bottom:6px}

/* ---- list rows ---- */
.row{padding:11px 16px;border-bottom:1px solid #f2eae3;cursor:pointer;display:flex;gap:10px;align-items:center}
.row:hover{background:#fbf7f3}
.row.on{background:var(--cream)}
.row .id{font-family:Georgia,serif;font-size:12.5px;color:var(--rose);min-width:62px}
.row .t{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-row-open{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border:1px solid var(--line);border-radius:50%;color:var(--rose);text-decoration:none;flex:0 0 auto}
.ref-row-open:hover{background:var(--rose);border-color:var(--rose);color:var(--white)}
.ref-link-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.ref-link-head label{margin:0}
.ref-open-btn{font-size:12px;color:var(--rose);text-decoration:none;white-space:nowrap}
.ref-open-btn:hover{text-decoration:underline}
.ref-url-preview{margin:-5px 0 12px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--cream);font-size:12px;line-height:1.4;overflow-wrap:anywhere}
.ref-url-preview a{color:var(--ink);text-decoration:none}
.ref-url-preview a:hover{color:var(--rose);text-decoration:underline}
.wk-head{padding:8px 16px;font-size:11px;letter-spacing:.08em;color:var(--muted);background:var(--cream);text-transform:uppercase}

/* ---- forms / detail ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 24px}
.tabs{display:flex;gap:4px;padding:12px 26px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{background:none;border:none;padding:8px 14px;font-size:13px;color:var(--muted);border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none}
.tabs button.on{background:var(--white);border-color:var(--line);color:var(--ink);position:relative;top:1px}
.savebar{display:flex;gap:10px;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.warn{background:var(--yellow);border-radius:8px;padding:9px 13px;font-size:12.5px;margin-top:10px}
.okmsg{background:var(--green);border-radius:8px;padding:9px 13px;font-size:12.5px;margin-top:10px}
.notice{background:var(--blue);border-radius:8px;padding:9px 13px;font-size:12.5px;margin:10px 0}
.danger-zone{margin-top:28px;padding-top:16px;border-top:1px dashed var(--line)}
.shoot-ref-intro{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;background:var(--blue);border-radius:10px;padding:13px 15px;margin-bottom:14px}
.shoot-ref-stats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}
.shoot-ref-stat{background:var(--cream);border:1px solid transparent;border-radius:8px;padding:7px 11px;font-size:12px;color:var(--muted);cursor:pointer}
.shoot-ref-stat:hover{border-color:var(--rose)}
.shoot-ref-stat.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.shoot-ref-stat b{font-family:Georgia,serif;font-size:17px;color:var(--ink);margin-right:4px;font-weight:400}
.shoot-ref-stat.on b{color:var(--paper)}
.shoot-sku-filters{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 18px}
.shoot-sku-filter{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
.shoot-sku-filter:hover{border-color:var(--rose);color:var(--ink)}
.shoot-sku-filter.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.shoot-sku-filter .count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;margin-left:5px;padding:0 5px;border-radius:999px;background:var(--cream);color:var(--ink);font-size:10.5px}
.shoot-sku-filter.on .count{background:var(--rose);color:var(--white)}
.shoot-ref-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.shoot-ref-summary{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.shoot-ref-summary .ref-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shoot-ref-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.shoot-ref-link{display:flex;gap:8px;align-items:center}
.shoot-ref-link input{min-width:0}
.shoot-ref-link a{white-space:nowrap;text-decoration:none}
.shoot-ref-empty{padding:30px 18px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted);margin-top:12px}

/* ---- script editor ---- */
.script-row{display:grid;grid-template-columns:86px 1fr 1.4fr 30px;gap:7px;margin-bottom:7px}
.script-row input{padding:8px 10px;font-size:12.5px}
.script-row .del{border:none;background:none;color:var(--muted);font-size:15px}
.script-head{display:grid;grid-template-columns:86px 1fr 1.4fr 30px;gap:7px;font-size:11px;color:var(--muted);margin-bottom:4px}

/* ---- tables ---- */
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;font-size:11px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 12px;border-bottom:1px solid #f2eae3;vertical-align:top}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:#fbf7f3}

/* ---- misc ---- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(41,35,33,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--paper);border-radius:14px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:24px}
.modal h3{font-size:19px;margin-bottom:10px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--cream);border-radius:8px;padding:12px;white-space:pre-wrap;max-height:260px;overflow:auto}
.empty-detail{padding:70px 30px;text-align:center;color:var(--muted)}
.empty-detail h2{font-size:20px;margin-bottom:8px;color:var(--ink)}
.subnav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
hr.soft{border:none;border-top:1px solid var(--line);margin:18px 0}
.kv{font-size:12.5px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:500}
.rel-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f2eae3;cursor:pointer}
.rel-item:last-child{border-bottom:none}
.rel-item:hover .t{color:var(--rose)}
details.sec{border:1px solid var(--line);border-radius:10px;margin-top:12px;background:var(--white)}
details.sec summary{padding:11px 14px;cursor:pointer;font-size:13.5px;list-style:none;display:flex;justify-content:space-between}
details.sec summary::after{content:"+";color:var(--muted)}
details.sec[open] summary::after{content:"–"}
details.sec .inner{padding:0 14px 14px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:920px){
  .two{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .wb-side{grid-template-columns:1fr}
  .script-row,.script-head{grid-template-columns:70px 1fr 1fr 26px}
  .shoot-ref-grid{grid-template-columns:1fr}
  .shoot-ref-intro{display:block}
  main{padding:16px 14px 80px}
  .topbar{padding:0 12px;gap:12px}
}
</style>
</head>

      "analysisRaw": "# INTERNAL ANALYSIS (ZH)\n## 内容概述\n当前 TikTok 链接无法被网页端直接抓取，因此**无法可靠验证这条视频的具体字幕、台词、镜头顺序与出镜方式**。以下不对原视频做虚构式逐镜复述，而是结合链接所属品牌 Untamed Petals 当前可索引的公开内容体系进行机制拆解。\n\nUntamed Petals 的公开定位是面向现代新娘的 bridal accessories / dresses 品牌，目前 Instagram 约 155K followers。citeturn591939search15 其头纱销售内容有一个很明确的特点：**不是单纯展示“这条 veil 很漂亮”，而是主动解决第一次购买头纱的新娘“不知道怎么选”的决策压力**。品牌公开的 veil 页面会围绕长度、个人风格、佩戴位置等购买变量组织内容，同时把教育内容直接连接到商品浏览。citeturn591939search18\n\n因此，这类内容真正值得 Sovelle 借鉴的不是某一句 hook 或某一种拍法，而是：\n\n**把一个视觉型产品，包装成一个非常容易理解的购买判断。**\n\n内容承担的不只是 awareness，而是在替消费者完成一部分 shopping decision。\n\n## 为什么有效\n第一层是 **Decision Simplification**。\n\n头纱是典型的低购买频率产品。消费者通常不是因为“不喜欢头纱”而犹豫，而是不知道：\n\n- 什么长度适合自己的 dress；\n- 蕾丝、珍珠、plain tulle 哪个会抢 dress；\n- veil 应该成为重点还是陪衬；\n- cathedral veil 会不会“too much”；\n- 网上买回来到底会呈现什么效果。\n\nUntamed Petals 的公开 veil 内容直接把这些复杂变量拆成容易理解的选择题。citeturn591939search18\n\n这对 DTC 特别重要，因为它在弥补线下 bridal stylist 的角色。\n\n第二层是 **Visualization Before Purchase**。\n\n头纱的商品价值很难通过平铺图体现。\n\n真正影响购买的是：\n\n**戴上以后，整套 bridal look 发生了什么变化。**\n\n所以有效内容通常不是回答：\n\n“What does this veil look like?”\n\n而是在回答：\n\n“What will I look like with this veil?”\n\n这一步把 product demonstration 变成 identity visualization。\n\n第三层是 **Micro Education + Product Desire**。\n\n不是纯教程，也不是纯广告。\n\n消费者先因为一个有用的信息停下来，再在信息过程中看到产品效果。\n\n典型路径是：\n\nProblem → Simple Rule → Visual Proof → Product Desire → CTA\n\n比：\n\nProduct → Product → Product → Shop Now\n\n更适合冷流量。\n\n第四层是 **低认知负担**。\n\n婚礼筹备本身已经有大量决策。\n\n“一个视频解决一个问题”比一次介绍 10 种 veil 更容易被保存，也更容易形成系列。\n\n这种内容天然有：\n\nSave value  \nShare value  \nSearch value  \nPurchase value\n\nTikTok 的推荐机制也会受到观看完成度及互动行为影响，因此这种结构清晰、能让用户等到答案出现的短视频，本身更适合短视频消费环境。citeturn591939academia21\n\n## Sovelle 可借鉴的机制\nSovelle 最值得复制的是以下 **抽象机制**，而不是 Untamed Petals 的具体创意。\n\n**机制 1：把产品展示变成一个判断工具**\n\n不要：\n\n“Meet our new cathedral veil.”\n\n改成：\n\n“When should your veil disappear into the dress — and when should it become the statement?”\n\n消费者获得一个判断框架。\n\n---\n\n**机制 2：先展示 bridal dilemma，再展示商品**\n\n例如：\n\nDress 很复杂 → veil 应该怎么选？\n\nDress 很干净 → veil 是否应该增加 texture？\n\nLong train → veil 长度到底应该超过 train 还是停在 train 前？\n\nHair up vs hair down → veil placement 对整体 silhouette 有什么区别？\n\n这些问题本身就是 Hook。\n\n---\n\n**机制 3：同一个变量只展示两个极端**\n\n不要一次出现八款 veil。\n\n一个视频：\n\nMinimal vs Detailed\n\n或：\n\nSoft movement vs Dramatic movement\n\n或：\n\nBlends with the dress vs Frames the dress\n\n视觉对比越简单，用户越容易形成偏好。\n\n---\n\n**机制 4：产品效果晚 1–2 秒揭晓**\n\n不要第一帧就把最佳效果全部交代。\n\n例如：\n\n0–2 秒：只有 wedding dress  \n2–4 秒：veil 从画面外进入  \n4–7 秒：完整 silhouette  \n7–10 秒：移动中的 veil\n\n产生一个非常轻微的 visual payoff。\n\n---\n\n**机制 5：把评论区变成消费者自我分类**\n\nCTA 不一定是：\n\nShop now.\n\n可以是：\n\n“Lace or clean edge?”\n\n“Would you let the dress lead—or the veil?”\n\n“Which would you wear with a satin gown?”\n\n用户实际上是在告诉 Sovelle：\n\n她喜欢什么产品。\n\n同时这些评论可以继续变成下一条内容。\n\n---\n\n**机制 6：建立 Sovelle 自己的可重复内容 IP**\n\n建议不要做 Untamed Petals 同款“veil choosing steps”。\n\nSovelle 可以建立：\n\n**The Veil Test**\n\n每条解决一个变量：\n\nThe Dress Detail Test  \nThe Train Test  \nThe Venue Test  \nThe Hair Test  \nThe Movement Test  \nThe Photo Test\n\n形成长期系列，而不是单条 viral content。\n\n---\n\n**机制 7：突出 DTC 最难在线上传递的变量——movement**\n\nSovelle 的内容重点应该逐渐从：\n\n蕾丝有多漂亮\n\n转变成：\n\nveil 如何落下  \n如何透光  \n如何跟随身体移动  \n边缘如何形成线条  \n背面如何覆盖或露出 gown detail  \n走路时 veil 与 train 的关系\n\n这些才是消费者静态 PDP 最难判断的东西。\n\n## 不能复制\n不能复制原 TikTok 的：\n\n- 原始 Hook 句子；\n- 原字幕结构；\n- 原视频逐镜顺序；\n- 原创作者的个人经历或第一人称故事；\n- 原模特或工作人员的人设；\n- 原来的 before/after 具体呈现方式；\n- 原造型搭配；\n- 原婚纱款式 + 头纱款式组合；\n- 原拍摄场地；\n- 原机位组合；\n- 原字体；\n- 原封面版式；\n- 原 Caption；\n- 原 CTA；\n- Untamed Petals 品牌语言、Logo、包装、视觉资产；\n- 任何足以让用户认为 Sovelle 在 remake 原视频的识别性元素。\n\n尤其不能把：\n\n**“原视频换一个模特 + 换成 Sovelle 产品”**\n\n当成原创。\n\nSovelle 应复制的是：\n\n**问题 → 判断 → 视觉验证 → 购买欲望**\n\n而不是原内容的外观。\n\n## Sovelle 原创改写方向\n建议把这条内容改造成 Sovelle 自己的：\n\n**“The Veil Test: Does Your Dress Need More Detail?”**\n\n核心不是介绍某条 veil。\n\n而是帮助新娘判断：\n\n**她的 veil 应该继续 dress 的设计语言，还是故意保持安静。**\n\n原创结构：\n\n第一阶段：\n\n一件视觉信息比较丰富的婚纱。\n\n屏幕问题：\n\n“Your dress already has detail. Should your veil match it?”\n\n第二阶段：\n\n展示 Option A：\n\n有明显 lace / appliqué / pearl detail 的 veil。\n\n只需要非常短。\n\n第三阶段：\n\n切换 Option B：\n\nclean sheer veil。\n\n第四阶段：\n\n用远景看到完整 silhouette。\n\n最后不告诉消费者：\n\n“This one is better.”\n\n而是给原则：\n\n**If the dress is the statement, the veil can frame it instead of competing with it.**\n\n这样 Sovelle 的身份会更像：\n\n**懂 bridal styling 的 veil brand**\n\n而不是：\n\n**卖 veil 的 Shopify store。**\n\n这个方向尤其适合美国 DTC，因为它降低消费者在没有 bridal stylist 情况下在线购买的风险感。\n\n未来可以连续扩展：\n\nEpisode 01 — Dress Detail  \nEpisode 02 — Train Length  \nEpisode 03 — Hair Placement  \nEpisode 04 — Venue  \nEpisode 05 — Photography  \nEpisode 06 — Movement\n\n最终形成：\n\n**Sovelle Veil School**\n\n但内容本身仍保持 TikTok 化，不需要做成正式课堂。\n\n## 统一 Shot List\n总时长建议：9–13 秒。\n\n**Shot A｜Decision**\n\n婚纱后背中近景。\n\n没有 veil。\n\n人物保持自然站姿，不看镜头。\n\n目的：\n\n让观众先观察 dress 本身。\n\n---\n\n**Shot B｜Option 1**\n\ndetail veil 被轻轻放下。\n\n不要复杂 transition。\n\n镜头固定，让产品变化本身成为 transition。\n\n重点看到：\n\nlace / embellishment 与 dress detail 的关系。\n\n---\n\n**Shot C｜Option 2**\n\n同一个 gown 换成 clean sheer veil。\n\n保持：\n\n同机位  \n同光线  \n同人物  \n同姿势\n\n这样用户可以真正比较。\n\n---\n\n**Shot D｜Full Silhouette**\n\n后退到全身。\n\n看到：\n\nveil  \ntrain  \ndress  \n整体比例\n\n重点不是模特，而是 silhouette。\n\n---\n\n**Shot E｜Movement**\n\n人物自然向前走 2–3 步。\n\nveil 出现轻微 movement。\n\n不要甩 veil。\n\n不要制造明显 commercial slow motion。\n\n---\n\n**Shot F｜Detail**\n\nveil 边缘或 tulle 覆盖 dress 的近景。\n\n让消费者看到透明度。\n\n---\n\n**Shot G｜Final**\n\n完整背面 bridal look。\n\n屏幕文字：\n\n“Let the dress lead—or let the veil?”\n\nLogo 只在最后非常小地出现：\n\nSovelle Bridal\n\n# PUBLIC COPY (EN)\n## TikTok\nContent Title:\nThe Veil Test: Does Your Dress Need More Detail?\n\nHook:\nYour dress already has detail. Should your veil match it?\n\nCover:\nTHE VEIL TEST  \nDetail or Clean?\n\nCaption:\nA detailed dress doesn’t always need a detailed veil. Sometimes the best pairing is the one that lets the gown breathe.\n\nSave this for your final fitting.\n\nCTA:\nWould you choose detail or clean?\n\n## Instagram\nContent Title:\nThe Veil Test: Detail vs. Clean\n\nHook:\nThe veil doesn’t always have to match the dress.\n\nCover:\nDETAIL VEIL  \nvs.  \nCLEAN VEIL\n\nCaption:\nTwo veils. Same dress. Completely different balance.\n\nA detailed veil can continue the design of the gown. A clean veil can frame it and let the dress stay in focus.\n\nNeither is automatically right—the question is what you want the eye to notice first.\n\nSave this for your bridal fitting.\n\nCTA:\nWhich pairing would you choose?\n\n## Pinterest\nContent Title:\nHow to Choose a Veil for a Detailed Wedding Dress\n\nHook:\nDoes a detailed wedding dress need a detailed veil?\n\nCover:\nHOW TO PAIR A VEIL  \nWITH A DETAILED DRESS\n\nCaption:\nIf your wedding dress already has lace, beading, texture, or appliqué, compare two directions before choosing your veil: continue the detail or create contrast with a clean sheer veil.\n\nSeeing both with the full train can make the decision much easier.\n\nSave this veil styling idea for your dress fitting.\n\nCTA:\nExplore wedding veil styling ideas from Sovelle Bridal.\n\n# INTERNAL SCRIPT (ZH)\n## TikTok\n- 0–2s | 画面: 婚纱背面中景，无头纱，完整保留 gown 本身的 lace / texture 信息 | 执行: 镜头固定，屏幕出现 “Your dress already has detail. Should your veil match it?”；不要第一秒展示产品答案。\n- 2–4s | 画面: 第一条 detail veil 自然落到婚纱后背 | 执行: 不做转场特效，让 veil 进入画面本身成为 visual change；确保能看到 veil 与 dress detail 同时存在。\n- 4–6s | 画面: 同机位切换 clean sheer veil | 执行: 人物、姿势、焦段和光线全部保持一致，让消费者可以直接比较，而不是被不同画面干扰。\n- 6–8s | 画面: clean veil 完整背面全身 | 执行: 镜头稍微后退，让 veil length、dress train 和整体 silhouette 同时进入画面。\n- 8–10s | 画面: 模特自然向前走，veil 轻微移动 | 执行: 不甩 veil、不造风；使用真实 walking movement 表现 tulle 的重量和垂坠。\n- 10–12s | 画面: 最终完整 bridal look | 执行: 屏幕出现 “Let the dress lead—or let the veil?”；最后 0.5–1 秒小尺寸 Sovelle Bridal 标识。\n\n## Instagram\n- 0–2s | 画面: Dress-only 背面完整构图 | 执行: Reels 第一帧必须让婚纱结构清楚；文字 “The veil doesn’t always have to match the dress.”\n- 2–4s | 画面: Detailed veil look | 执行: 屏幕只标记 “DETAIL”，不要加入产品名称、价格等销售信息。\n- 4–6s | 画面: Clean veil look | 执行: 同机位切换并标记 “CLEAN”，形成真正 A/B comparison。\n- 6–9s | 画面: 两种效果各出现一次完整 silhouette | 执行: 节奏比 TikTok 稍慢，让用户有时间观察 dress 与 veil 的视觉比例。\n- 9–12s | 画面: clean 或 detail veil 的 movement close-up | 执行: 拍透明度、边缘和覆盖婚纱后的 texture，而不是只拍模特。\n- 12–14s | 画面: 完整 bridal look | 执行: 文字 “What should the eye notice first?”；以问题结束，引导评论。\n\n## Pinterest\n- 0–2s | 画面: 一件有明显设计细节的 wedding dress 背面 | 执行: 第一屏直接使用可搜索型文字 “How to choose a veil for a detailed wedding dress”。\n- 2–5s | 画面: Detailed veil 搭配 | 执行: 屏幕短文字 “OPTION 1 — Continue the detail”。\n- 5–8s | 画面: Clean sheer veil 搭配 | 执行: 屏幕短文字 “OPTION 2 — Create contrast”。\n- 8–11s | 画面: 完整 dress + train + veil 全身背面 | 执行: 保留较长观察时间，Pinterest 用户需要看清搭配结果。\n- 11–14s | 画面: veil 覆盖 lace / satin / appliqué 的局部近景 | 执行: 强调 online shopping 最难判断的 transparency 与 layering。\n- 14–17s | 画面: 最终完整造型 | 执行: 屏幕 “Save for your dress fitting”；底部小尺寸 Sovelle Bridal。",

nDress 很干净 → veil 是否应该增加 texture？\n\nLong train → veil 长度到底应该超过 train 还是停在 train 前？\n\nHair up vs hair down → veil placement 对整体 silhouette 有什么区别？\n\n这些问题本身就是 Hook。\n\n---\n\n**机制 3：同一个变量只展示两个极端**\n\n不要一次出现八款 veil。\n\n一个视频：\n\nMinimal vs Detailed\n\n或：\n\nSoft movement vs Dramatic movement\n\n或：\n\nBlends with the dress vs Frames the dress\n\n视觉对比越简单，用户越容易形成偏好。\n\n---\n\n**机制 4：产品效果晚 1–2 秒揭晓**\n\n不要第一帧就把最佳效果全部交代。\n\n例如：\n\n0–2 秒：只有 wedding dress  \n2–4 秒：veil 从画面外进入  \n4–7 秒：完整 silhouette  \n7–10 秒：移动中的 veil\n\n产生一个非常轻微的 visual payoff。\n\n---\n\n**机制 5：把评论区变成消费者自我分类**\n\nCTA 不一定是：\n\nShop now.\n\n可以是：\n\n“Lace or clean edge?”\n\n“Would you let the dress lead—or the veil?”\n\n“Which would you wear with a satin gown?”\n\n用户实际上是在告诉 Sovelle：\n\n她喜欢什么产品。\n\n同时这些评论可以继续变成下一条内容。\n\n---\n\n**机制 6：建立 Sovelle 自己的可重复内容 IP**\n\n建议不要做 Untamed Petals 同款“veil choosing steps”。\n\nSovelle 可以建立：\n\n**The Veil Test**\n\n每条解决一个变量：\n\nThe Dress Detail Test  \nThe Train Test  \nThe Venue Test  \nThe Hair Test  \nThe Movement Test  \nThe Photo Test\n\n形成长期系列，而不是单条 viral content。\n\n---\n\n**机制 7：突出 DTC 最难在线上传递的变量——movement**\n\nSovelle 的内容重点应该逐渐从：\n\n蕾丝有多漂亮\n\n转变成：\n\nveil 如何落下  \n如何透光  \n如何跟随身体移动  \n边缘如何形成线条  \n背面如何覆盖或露出 gown detail  \n走路时 veil 与 train 的关系\n\n这些才是消费者静态 PDP 最难判断的东西。\n\n## 不能复制\n不能复制原 TikTok 的：\n\n- 原始 Hook 句子；\n- 原字幕结构；\n- 原视频逐镜顺序；\n- 原创作者的个人经历或第一人称故事；\n- 原模特或工作人员的人设；\n- 原来的 before/after 具体呈现方式；\n- 原造型搭配；\n- 原婚纱款式 + 头纱款式组合；\n- 原拍摄场地；\n- 原机位组合；\n- 原字体；\n- 原封面版式；\n- 原 Caption；\n- 原 CTA；\n- Untamed Petals 品牌语言、Logo、包装、视觉资产；\n- 任何足以让用户认为 Sovelle 在 remake 原视频的识别性元素。\n\n尤其不能把：\n\n**“原视频换一个模特 + 换成 Sovelle 产品”**\n\n当成原创。\n\nSovelle 应复制的是：\n\n**问题 → 判断 → 视觉验证 → 购买欲望**\n\n而不是原内容的外观。\n\n## Sovelle 原创改写方向\n建议把这条内容改造成 Sovelle 自己的：\n\n**“The Veil Test: Does Your Dress Need More Detail?”**\n\n核心不是介绍某条 veil。\n\n而是帮助新娘判断：\n\n**她的 veil 应该继续 dress 的设计语言，还是故意保持安静。**\n\n原创结构：\n\n第一阶段：\n\n一件视觉信息比较丰富的婚纱。\n\n屏幕问题：\n\n“Your dress already has detail. Should your veil match it?”\n\n第二阶段：\n\n展示 Option A：\n\n有明显 lace / appliqué / pearl detail 的 veil。\n\n只需要非常短。\n\n第三阶段：\n\n切换 Option B：\n\nclean sheer veil。\n\n第四阶段：\n\n用远景看到完整 silhouette。\n\n最后不告诉消费者：\n\n“This one is better.”\n\n而是给原则：\n\n**If the dress is the statement, the veil can frame it instead of competing with it.**\n\n这样 Sovelle 的身份会更像：\n\n**懂 bridal styling 的 veil brand**\n\n而不是：\n\n**卖 veil 的 Shopify store。**\n\n这个方向尤其适合美国 DTC，因为它降低消费者在没有 bridal stylist 情况下在线购买的风险感。\n\n未来可以连续扩展：\n\nEpisode 01 — Dress Detail  \nEpisode 02 — Train Length  \nEpisode 03 — Hair Placement  \nEpisode 04 — Venue  \nEpisode 05 — Photography  \nEpisode 06 — Movement\n\n最终形成：\n\n**Sovelle Veil School**\n\n但内容本身仍保持 TikTok 化，不需要做成正式课堂。\n\n## 统一 Shot List\n总时长建议：9–13 秒。\n\n**Shot A｜Decision**\n\n婚纱后背中近景。\n\n没有 veil。\n\n人物保持自然站姿，不看镜头。\n\n目的：\n\n让观众先观察 dress 本身。\n\n---\n\n**Shot B｜Option 1**\n\ndetail veil 被轻轻放下。\n\n不要复杂 transition。\n\n镜头固定，让产品变化本身成为 transition。\n\n重点看到：\n\nlace / embellishment 与 dress detail 的关系。\n\n---\n\n**Shot C｜Option 2**\n\n同一个 gown 换成 clean sheer veil。\n\n保持：\n\n同机位  \n同光线  \n同人物  \n同姿势\n\n这样用户可以真正比较。\n\n---\n\n**Shot D｜Full Silhouette**\n\n后退到全身。\n\n看到：\n\nveil  \ntrain  \ndress  \n整体比例\n\n重点不是模特，而是 silhouette。\n\n---\n\n**Shot E｜Movement**\n\n人物自然向前走 2–3 步。\n\nveil 出现轻微 movement。\n\n不要甩 veil。\n\n不要制造明显 commercial slow motion。\n\n---\n\n**Shot F｜Detail**\n\nveil 边缘或 tulle 覆盖 dress 的近景。\n\n让消费者看到透明度。\n\n---\n\n**Shot G｜Final**\n\n完整背面 bridal look。\n\n屏幕文字：\n\n“Let the dress lead—or let the veil?”\n\nLogo 只在最后非常小地出现：\n\nSovelle Bridal",

function separateShootReferenceLibraries(db){

function copyReferenceInboxRecords(db,shootId){
  const shoot=(db.shoots||[]).find(s=>s.id===shootId); if(!shoot)return 0;
  shoot.captureReferences=Array.isArray(shoot.captureReferences)?shoot.captureReferences:[];
  let added=0;
  (db.references||[]).forEach(source=>{
    if(!source||!source.id)return;
    const same=shoot.captureReferences.find(r=>r.sourceReferenceId===source.id||(source.url&&String(r.url||"").trim()===String(source.url).trim()));
    if(same){if(!same.sourceReferenceId)same.sourceReferenceId=source.id;return;}
    let n=1,id="";const used=new Set(shoot.captureReferences.map(r=>r.id));
    do{id="SREF-"+String(n++).padStart(3,"0");}while(used.has(id));
    const linked=(db.projects||[]).find(p=>p.id===source.linkedContentId);
    const topic=String(source.topicZh||"").trim();
    shoot.captureReferences.push({
      id,sourceReferenceId:source.id,

      platform:source.platform||inferShootReferencePlatform(source.url),url:source.url||"",
      captureType:"整体氛围",status:"已收藏",priority:"可选",
      skuCodes:linked&&Array.isArray(linked.skuCodes)?linked.skuCodes.slice():[],
      notes:source.note||""
    });
    added++;
  });
  return added;
}

function syncProjectStatus(p){
  const pubs = DB.publications.filter(x=>x.contentId===p.id);
  if(!pubs.length){ if(stIdx(p.status)>=7) p.status = "Approved"; return; }
  let target = "Scheduled";

  if(pubs.length && pubs.every(x=>x.verdict && x.learning) ) target = "Reviewed";

function depSatisfied(p){
  if(p.dependencyType==="shoot"){
    const s = p.shootId ? getShoot(p.shootId) : null;
    return !!(s && s.status==="Delivered");
  }
  if(p.dependencyType==="asset") return (p.assetIds||[]).length>0;

}

  }

  return "独立拍摄";
}

/* 脚本完整性校验(非阻断) */
function validateScript(rows, format){
  const issues = [];
  if(!rows || !rows.length) return ["脚本为空——至少需要一行「时间 | 画面 | 执行」。"];
  rows.forEach((r,i)=>{
    if(!r[0]||!r[0].trim()) issues.push(`第 ${i+1} 行缺少时间段。`);
    if(!r[1]||!r[1].trim()) issues.push(`第 ${i+1} 行缺少画面描述。`);
    if(!r[2]||!r[2].trim()) issues.push(`第 ${i+1} 行缺少执行说明。`);
    if(r[2] && /英文字幕|字幕[::]/.test(r[2])){
      const m = r[2].split(/[::]/).slice(1).join(":");
      if(m && !/[A-Za-z]/.test(m)) issues.push(`第 ${i+1} 行声明了字幕但字幕文本不是英文。`);
    }
  });
  const fm = (format||"").match(/(\d+)\s*s/);
  const last = rows[rows.length-1] && rows[rows.length-1][0];
  const lm = last && last.match(/(\d+)\s*s?\s*$/);
  if(fm && lm){
    const declared = parseInt(fm[1],10), actual = parseInt(lm[1],10);
    if(Math.abs(declared-actual) > Math.max(8, declared*0.4)) issues.push(`脚本总时长约 ${actual}s,与格式声明的 ${declared}s 相差较大。`);
  }
  return issues;
}

/* ================= 工作台队列计算 ================= */
function calcQueues(){
  const m = DB.selectedMonth;
  const projs = DB.projects.filter(p=>p.month===m);
  const q = {};

  // 1 待复盘:已发布(或排期日已过)且未填结果
  q.review = DB.publications.filter(x=>{
    if(x.verdict && x.learning) return false;
    const eff = x.publishedAt || (daysSince(x.scheduledAt)!==null && daysSince(x.scheduledAt)>=0 ? x.scheduledAt : null);
    return !!eff;
  }).map(x=>({pub:x, days:daysSince(x.publishedAt||x.scheduledAt)}))
    .sort((a,b)=>b.days-a.days);

  // 2 待复投:复盘结论要求复投/改 hook,且尚未派生新项目
  q.redo = DB.publications.filter(x=>{
    if(!(x.nextAction==="复投"||x.nextAction==="改 hook 重发")) return false;
    return !DB.projects.some(p=>p.derivedFrom===x.id);
  });

  // 3 可发布:已定稿但没有任何发布记录
  q.publish = projs.filter(p=>p.status==="Approved" && !DB.publications.some(x=>x.contentId===p.id));

  // 4 可剪辑:已拍摄,或素材依赖满足且尚未进入剪辑
  q.edit = projs.filter(p=> p.status==="Shot" ||
    (p.dependencyType==="asset" && depSatisfied(p) && ["Scripted","Ready to Shoot"].includes(p.status)) );

  // 5 待拍摄
  q.shoot = projs.filter(p=>p.status==="Ready to Shoot");
  q.shootFounder = q.shoot.filter(p=>p.needsFounder);
  q.shootOther = q.shoot.filter(p=>!p.needsFounder);

  // 6 缺脚本
  q.script = projs.filter(p=>["Idea","Brief"].includes(p.status));

  // 7 依赖未解决
  q.blocked = projs.filter(p=>{
    if(p.dependencyType==="shoot" && !depSatisfied(p) && stIdx(p.status)<4) return true;
    if(p.dependencyType==="asset" && !(p.assetIds||[]).length && stIdx(p.status)<5) return true;
    return false;
  });

  q.total = q.review.length + q.redo.length + q.publish.length + q.edit.length + q.shoot.length + q.script.length + q.blocked.length;
  return q;
}

  const learns = DB.publications.filter(x=>x.learning).slice(-3).reverse();
  html += `<div class="wb-side">
    <div class="panel"><div class="hd"><h3>Pillar 覆盖</h3></div><div class="bd"><table class="cov">${PILLARS.map(x=>`<tr><td>${esc(x)}</td><td>${pilCount[x]||0}</td></tr>`).join("")}</table></div></div>
    <div class="panel"><div class="hd"><h3>平台 / SKU 覆盖</h3></div><div class="bd"><table class="cov">${PLATFORMS.map(x=>`<tr><td>${x}</td><td>${platCount[x]}</td></tr>`).join("")}</table><hr class="soft"><div class="pills">${DB.skus.map(s=>`<span class="chip ${skuUse[s.code]?"sku":""}" style="${skuUse[s.code]?"":"opacity:.4"}">${s.code} ${skuUse[s.code]||0}</span>`).join("")}</div></div></div>
    <div class="panel"><div class="hd"><h3>最近的学习</h3><button class="btn sm ghost" onclick="UI.view='pub';UI.pubTab='learn';render()">全部</button></div><div class="bd">${learns.length?learns.map(x=>`<div class="learn-line">${(x.learningTags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(" ")} ${esc(x.learning)}</div>`).join(""):`<p class="kv">还没有复盘沉淀。发布后填写结果与学习,它们会出现在这里并在新建同类内容时被提示。</p>`}</div></div>
  </div>`;
  return html;
}
function renderPlatformBoard(projs){
  let html = `<div class="pb">`;
  PLATFORMS.forEach(plat=>{
    const on = p => p.platforms[plat] && p.platforms[plat].state!=="Not Planned";
    const pubs = DB.publications.filter(x=>x.platform===plat);
    const review = pubs.filter(x=>{
      if(x.verdict && x.learning) return false;
      return !!(x.publishedAt || (daysSince(x.scheduledAt)!==null && daysSince(x.scheduledAt)>=0));
    }).sort((a,b)=>(a.publishedAt||a.scheduledAt||"").localeCompare(b.publishedAt||b.scheduledAt||""));
    const sched = pubs.filter(x=>!x.publishedAt && x.scheduledAt && daysSince(x.scheduledAt)<0)
      .sort((a,b)=>a.scheduledAt.localeCompare(b.scheduledAt));
    const pubbedIds = new Set(pubs.map(x=>x.contentId));
    const publishable = projs.filter(p=>p.status==="Approved" && on(p) && !pubbedIds.has(p.id));
    const making = projs.filter(p=>on(p) && stIdx(p.status)<6);
    const done = pubs.filter(x=>x.verdict && x.learning).length;
    const total = review.length + sched.length + publishable.length + making.length;

    html += `<div class="pb-col"><div class="ph"><h3>${plat}</h3><span class="kv">${total} 在途 · ${done} 已复盘</span></div>`;

    const item = (id,title,meta,click,hot)=>`<div class="pb-item ${hot?"hot":""}" onclick="${click}">
      <div class="l1"><span class="id">${esc(id)}</span><span class="t">${esc(title)}</span></div>
      <div class="l2">${meta}</div></div>`;

    if(review.length){
      html += `<div class="pb-sec hot">待复盘 · ${review.length}</div>`;
      review.forEach(x=>{
        const p=getProject(x.contentId); const d=daysSince(x.publishedAt||x.scheduledAt);
        html += item(x.contentId, p?p.title:"", `${esc(x.publishedAt||x.scheduledAt)} 发布${d!=null?` · 已过 ${d} 天`:""}`, `openPub('${x.id}')`, true);
      });
    }
    html += `<div class="pb-sec">已排期 · ${sched.length}</div>`;
    sched.length ? sched.forEach(x=>{
      const p=getProject(x.contentId);
      html += item(x.contentId, p?p.title:"", `${esc(x.scheduledAt)} · ${esc(x.hookVersion||"未填 hook")}`, `openPub('${x.id}')`);
    }) : html += `<div class="pb-empty">没有排期中的发布</div>`;
    html += `<div class="pb-sec">可发布 · ${publishable.length}</div>`;
    publishable.length ? publishable.forEach(p=>{
      html += `<div class="pb-item" onclick="openProject('${p.id}','${plat}')">
        <div class="l1"><span class="id">${esc(p.id)}</span><span class="t">${esc(p.title)}</span></div>
        <div class="l2">已定稿<button class="btn sm rose" style="margin-left:auto" onclick="event.stopPropagation();newPubForPlatform('${p.id}','${plat}')">创建发布</button></div></div>`;
    }) : html += `<div class="pb-empty">没有待排期的成片</div>`;
    html += `<div class="pb-sec">制作中 · ${making.length}</div>`;
    making.length ? making.forEach(p=>{
      const st = p.platforms[plat].state;
      html += item(p.id, p.title, `${stChip(p.status)} · 文案 ${esc(st)}${p.needsFounder?' · <span class="founder">出镜</span>':""}`, `openProject('${p.id}','${plat}')`);
    }) : html += `<div class="pb-empty">本月此平台暂无制作中内容</div>`;
    html += `<div class="pb-foot"></div></div>`;
  });
  html += `</div>`;
  return html;
}
function newPubForPlatform(pid, plat){
  const p = getProject(pid); if(!p) return;
  const id = nextId("PUB-", DB.publications, 3);
  const hook = (p.platforms[plat]&&p.platforms[plat].hook)||"";
  DB.publications.push({id,contentId:pid,platform:plat,scheduledAt:"",publishedAt:"",hookVersion:hook,goal:p.goal,metricValue:"",verdict:"",learning:"",learningTags:[],nextAction:""});
  syncProjectStatus(p);
  save(); openPub(id); toast(`已为 ${plat} 创建发布记录,${pid} 进入「已排期」`);
}
function mainPlatform(p){
  for(const pl of PLATFORMS){ if(p.platforms[pl] && p.platforms[pl].state!=="Not Planned") return pl; }
  return "TikTok";
}
function setStatus(id, s){
  const p = getProject(id); if(!p) return;
  p.status = s; save(); render();
}
</script>
<script>
"use strict";
/* ================= 内容管线 ================= */
function renderPipeline(){
  let html = `<div class="subnav">
    <button class="pill ${UI.pipeTab==="projects"?"on":""}" onclick="UI.pipeTab='projects';render()">内容项目</button>
    <button class="pill ${UI.pipeTab==="refs"?"on":""}" onclick="UI.pipeTab='refs';render()">参考收件箱 · ${DB.references.filter(r=>r.status==="inbox").length} 待处理</button>
  </div>`;
  html += UI.pipeTab==="projects" ? renderProjects() : renderRefs();
  return html;
}

function renderProjects(){
  const m = DB.selectedMonth;
  let projs = DB.projects.filter(p=>p.month===m);
  if(UI.statusFilter) projs = projs.filter(p=>p.status===UI.statusFilter);
  const byWeek = [1,2,3,4,5].map(w=>projs.filter(p=>p.week===w));
  const active = UI.activeProject ? getProject(UI.activeProject) : null;

  let list = `<div class="panel pad0"><div class="hd"><h3>本月项目</h3><button class="btn sm primary" onclick="newProject()">+ 新建</button></div>
  <div style="padding:12px 18px;border-bottom:1px solid var(--line)"><select onchange="UI.statusFilter=this.value;render()" style="font-size:12.5px">
    <option value="">全部状态</option>${STATUSES.map(s=>`<option value="${s}" ${UI.statusFilter===s?"selected":""}>${STATUS_ZH[s]}</option>`).join("")}
  </select></div><div class="bd" style="padding:0;max-height:70vh;overflow:auto">`;
  byWeek.forEach((arr,i)=>{
    if(!arr.length) return;
    list += `<div class="wk-head">Week ${i+1}</div>`;
    arr.forEach(p=>{
      list += `<div class="row ${active&&active.id===p.id?"on":""}" onclick="openProject('${p.id}')">
        <span class="id">${esc(p.id)}</span><span class="t">${esc(p.title)}${p.needsFounder?' <span class="founder">出镜</span>':''}</span>${stChip(p.status)}</div>`;
    });
  });
  if(!projs.length) list += `<div class="qempty">本月还没有项目。点「+ 新建」或从参考收件箱采纳一条参考开始。</div>`;
  list += `</div></div>`;

  let detail = active ? renderProjectDetail(active) :
    `<div class="panel"><div class="empty-detail"><h2>选择或新建一条内容</h2><p>左侧按周组织本月项目。每条内容从想法到复盘走同一条状态流。</p></div></div>`;
  return `<div class="two">${list}${detail}</div>`;
}

function renderProjectDetail(p){
  const tabs = ["Overview","TikTok","Instagram","Pinterest","Shot List"];
  const tab = UI.activePlatformTab;
  let html = `<div class="panel pad0">
    <div class="hd" style="flex-wrap:wrap">
      <div><span class="serif" style="font-size:19px;color:var(--rose)">${esc(p.id)}</span>
      <span class="serif" style="font-size:19px;margin-left:8px">${esc(p.title)}</span></div>
      <div style="display:flex;gap:8px;align-items:center">${stChip(p.status)}
        <select style="width:auto;font-size:12px" onchange="setStatus('${p.id}',this.value)" ${stIdx(p.status)>=7?"disabled title='已进入发布阶段,状态由发布记录自动推进'":""}>
          ${MANUAL_STATUSES.map(s=>`<option value="${s}" ${p.status===s?"selected":""}>${STATUS_ZH[s]}</option>`).join("")}
          ${stIdx(p.status)>=7?`<option selected>${STATUS_ZH[p.status]}</option>`:""}
        </select></div>
    </div>
    <div class="tabs">${tabs.map(t=>{
      let mark = "";
      if(PLATFORMS.includes(t)){ const st=p.platforms[t]?p.platforms[t].state:"Not Planned"; mark = st==="Not Planned"?"":(st==="Draft"?" ●":" ○"); }
      return `<button class="${tab===t?"on":""}" onclick="UI.activePlatformTab='${t}';render()">${t}${mark}</button>`;}).join("")}</div>
    <div class="bd pad">`;
  if(tab==="Overview") html += renderProjectOverview(p);
  else if(tab==="Shot List") html += renderShotListTab(p);
  else html += renderPlatformTab(p, tab);
  html += `</div></div>`;
  return html;
}

function renderProjectOverview(p){
  // 相关学习提示(回流机制)
  const rel = DB.publications.filter(x=>{
    if(!x.learning) return false;
    const rp = getProject(x.contentId);
    return rp && (rp.pillar===p.pillar || x.platform===mainPlatform(p)) && x.contentId!==p.id;
  }).slice(-3).reverse();
  let learnBox = rel.length ? `<div class="notice"><b>相关历史学习:</b>${rel.map(x=>`<div class="learn-line">${(x.learningTags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(" ")} ${esc(x.learning)} <span class="kv">(${esc(x.contentId)})</span></div>`).join("")}</div>` : "";

  const pubs = DB.publications.filter(x=>x.contentId===p.id);
  const g = GOAL_META[p.goal]||{};
  let html = learnBox + `
  <div class="grid2">
    <div><label>标题 <span class="zh">(英文对外)</span></label><input id="f_title" value="${esc(p.title)}"></div>
    <div><label>格式</label><input id="f_format" value="${esc(p.format)}" placeholder="如 30s styling comparison"></div>
    <div><label>Pillar <span class="zh">讲什么</span></label><select id="f_pillar">${PILLARS.map(x=>`<option ${p.pillar===x?"selected":""}>${x}</option>`).join("")}</select></div>
    <div><label>漏斗目标 <span class="zh">为什么讲</span></label><select id="f_goal" onchange="document.getElementById('goalHint').textContent=goalHint(this.value)">${GOALS.map(x=>`<option ${p.goal===x?"selected":""}>${x}</option>`).join("")}</select>
      <div class="kv" id="goalHint" style="margin-top:4px">${goalHint(p.goal)}</div></div>
    <div><label>周次</label><select id="f_week">${[1,2,3,4,5].map(w=>`<option value="${w}" ${p.week===w?"selected":""}>Week ${w}</option>`).join("")}</select></div>
    <div><label>月份</label><select id="f_month">${DB.months.map(mm=>`<option ${p.month===mm?"selected":""}>${mm}</option>`).join("")}</select></div>
  </div>

  <label>SKU 选择 <span class="zh">(来自 SKU 字典,可多选;纯品牌内容可不选)</span></label>
  <div class="pills">${DB.skus.map(s=>`<span class="chip sku ${p.skuCodes.includes(s.code)?"on":""} ${isSample(s.code)?"sample":""}" onclick="toggleSku('${p.id}','${s.code}')">${s.code}${isSample(s.code)?" · 样品":""}</span>`).join("")}</div>
  ${p.skuCodes.some(isSample)?`<div class="warn">包含 Editorial Sample(非自动售卖)——对外文案不得引导购买该样品。</div>`:""}

  <div class="grid2">
    <div><label>拍摄依赖</label><select id="f_dep" onchange="depFieldsToggle(this.value)">${Object.entries(DEP_TYPES).map(([k,v])=>`<option value="${k}" ${p.dependencyType===k?"selected":""}>${v}</option>`).join("")}</select></div>
    <div><label>需创始人出镜</label><select id="f_founder"><option value="0" ${!p.needsFounder?"selected":""}>否</option><option value="1" ${p.needsFounder?"selected":""}>是(在待拍摄队列聚合)</option></select></div>
    <div id="dep_shoot" style="${p.dependencyType==="shoot"?"":"display:none"}"><label>关联拍摄项目</label><select id="f_shootId"><option value="">— 选择 —</option>${DB.shoots.map(s=>`<option value="${s.id}" ${p.shootId===s.id?"selected":""}>${s.id} · ${esc(s.title)}(${SHOOT_STATUS_ZH[s.status]})</option>`).join("")}</select></div>
    <div id="dep_asset" style="${p.dependencyType==="asset"?"":"display:none"}"><label>关联素材</label><div class="pills">${DB.assets.map(a=>`<span class="chip sku ${(p.assetIds||[]).includes(a.id)?"on":""}" onclick="toggleAsset('${p.id}','${a.id}')">${a.id}</span>`).join("")||'<span class="kv">素材库为空</span>'}</div></div>
  </div>
  ${p.dependencyType!=="independent" && !depSatisfied(p) ? `<div class="warn">依赖未满足:${esc(depLabel(p))}。满足前项目不会进入「待拍摄 / 可剪辑」队列。</div>`:""}

  <label>中文内部简报</label><textarea id="f_brief">${esc(p.briefZh)}</textarea>
  <label>制作 / 产品备注</label><textarea id="f_notes" style="min-height:50px">${esc(p.productNotes)}</textarea>

  ${p.referenceIds && p.referenceIds.length ? `<label>关联参考</label><div class="pills">${p.referenceIds.map(r=>`<span class="chip sku" onclick="openRef('${r}')">${r}</span>`).join("")}</div>`:""}
  ${p.derivedFrom?`<p class="kv" style="margin-top:8px">由发布记录 ${esc(p.derivedFrom)} 派生(复投 / 改 hook)。</p>`:""}

  ${pubs.length?`<hr class="soft"><label>发布记录</label>${pubs.map(x=>`<div class="rel-item" onclick="openPub('${x.id}')"><span class="id serif" style="color:var(--rose)">${esc(x.platform)}</span><span class="t" style="flex:1">${esc(x.hookVersion||"(未填 hook)")}</span><span class="kv">${esc(x.publishedAt||x.scheduledAt||"未排期")} ${x.verdict?"· "+esc(x.verdict):""}</span></div>`).join("")}`:""}

  <div class="savebar">
    <button class="btn primary" onclick="saveProjectOverview('${p.id}')">保存概览</button>
    ${p.status==="Approved"?`<button class="btn rose" onclick="newPubFor('${p.id}')">创建发布记录</button>`:""}
    <span class="kv">目标「${p.goal}」的复盘主指标:${esc(g.metric||"")}</span>
  </div>
  <div class="danger-zone">
    <button class="btn sm" onclick="renameProjectPrompt('${p.id}')">重命名 Content ID</button>
    <button class="btn sm danger" onclick="deleteProject('${p.id}')">删除此项目</button>
  </div>`;
  return html;
}
function goalHint(g){ const x=GOAL_META[g]; return x?`主指标:${x.metric} · 次指标:${x.sub}`:""; }
function depFieldsToggle(v){
  document.getElementById("dep_shoot").style.display = v==="shoot"?"":"none";
  document.getElementById("dep_asset").style.display = v==="asset"?"":"none";
}
function toggleSku(pid, code){
  const p=getProject(pid); const i=p.skuCodes.indexOf(code);
  if(i>=0) p.skuCodes.splice(i,1); else p.skuCodes.push(code);
  save(true); render();
}
function toggleAsset(pid, aid){
  const p=getProject(pid); p.assetIds=p.assetIds||[];
  const i=p.assetIds.indexOf(aid);
  if(i>=0) p.assetIds.splice(i,1); else p.assetIds.push(aid);
  save(true); render();
}
function saveProjectOverview(pid){
  const p=getProject(pid); if(!p) return;
  p.title=document.getElementById("f_title").value.trim();
  p.format=document.getElementById("f_format").value.trim();
  p.pillar=document.getElementById("f_pillar").value;
  p.goal=document.getElementById("f_goal").value;
  p.week=parseInt(document.getElementById("f_week").value,10);
  p.month=document.getElementById("f_month").value;
  p.dependencyType=document.getElementById("f_dep").value;
  p.needsFounder=document.getElementById("f_founder").value==="1";
  const sh=document.getElementById("f_shootId"); if(sh) p.shootId=sh.value;
  p.briefZh=document.getElementById("f_brief").value;
  p.productNotes=document.getElementById("f_notes").value;
  save(); render();
}
function newProject(){
  const id = nextId(monthPrefix(DB.selectedMonth)+"-", DB.projects, 3);
  DB.projects.push({id,month:DB.selectedMonth,week:1,title:"Untitled",pillar:PILLARS[0],goal:"Trust",status:"Idea",format:"",briefZh:"",referenceIds:[],skuCodes:[],productNotes:"",dependencyType:"independent",shootId:"",assetIds:[],needsFounder:false,derivedFrom:"",platforms:{TikTok:{state:"Planned",hook:"",cover:"",script:[],caption:"",cta:""},Instagram:{state:"Not Planned",hook:"",cover:"",script:[],caption:"",cta:""},Pinterest:{state:"Not Planned",hook:"",cover:"",script:[],caption:"",cta:""}},shotList:""});
  save(); openProject(id);
}
function renameProjectPrompt(pid){
  askInput("重命名 Content ID", "重命名会自动迁移参考、素材与发布记录的全部关联。格式:XXX-000。", pid, "重命名", nv=>{
  if(!nv || nv===pid) { render(); return; }
  const id = nv.trim().toUpperCase();
  if(!/^[A-Z]{3}-\d{3}$/.test(id)){ toast("格式应为 XXX-000,如 JUL-013"); return; }
  if(DB.projects.some(p=>p.id===id)){ toast("该 ID 已被占用。如需交换两个 ID,请先改成临时 ID。"); return; }
  const p=getProject(pid); p.id=id;
  DB.references.forEach(r=>{ if(r.linkedContentId===pid) r.linkedContentId=id; });
  DB.assets.forEach(a=>{ if(a.contentId===pid) a.contentId=id; });
  DB.publications.forEach(x=>{ if(x.contentId===pid) x.contentId=id; });
  DB.projects.forEach(x=>{ if(x.derivedFrom===pid) x.derivedFrom=id; });
  UI.activeProject=id; save(); render(); toast("已重命名并迁移全部关联");
  });
}
function deleteProject(pid){
  const pubs=DB.publications.filter(x=>x.contentId===pid).length;
  askConfirm("删除内容项目", `删除 ${pid}?其平台文案与脚本将一并删除${pubs?`,${pubs} 条发布记录将失去关联`:""}。可通过「数据 → 恢复上一次备份」撤销。`, "删除", ()=>{
    DB.projects=DB.projects.filter(p=>p.id!==pid);
    UI.activeProject=null; save(); render(); toast("已删除 "+pid);
  });
}

/* ---- 平台标签页 ---- */
function renderPlatformTab(p, plat){
  const v = p.platforms[plat] || {state:"Not Planned",hook:"",cover:"",script:[],caption:"",cta:""};
  p.platforms[plat] = v;
  if(v.state==="Not Planned"){
    return `<div class="empty-detail"><h2>${plat} 未启用</h2><p>这条内容目前没有 ${plat} 版本。</p><p style="margin-top:14px"><button class="btn primary" onclick="enablePlatform('${p.id}','${plat}')">启用 ${plat} 版本</button></p></div>`;
  }
  const issues = validateScript(v.script, p.format);
  const hasPlaceholder = v._placeholder;
  let html = `
  ${v.reuseSource==="TikTok"?`<div class="notice"><b>共用视频素材：</b>这个 Instagram Reel 直接使用 TikTok 的同一条视频 master，不安排额外拍摄。这里只单独管理 Instagram 封面、Caption 和 CTA。 <button class="btn sm" style="margin-left:8px" onclick="syncInstagramVideoFromTikTok('${p.id}')">同步最新 TikTok 脚本</button></div>`:""}
  ${v.contentType==="Instagram Carousel"?`<div class="notice"><b>Instagram 专属图文：</b>这不是另一条视频。下方每一行代表一页 Carousel，需要单独完成版式、图片或纯文字信息。</div>`:""}
  <div class="grid2">
    <div><label>Hook <span class="zh">(英文对外)</span></label><input id="p_hook" value="${esc(v.hook)}"></div>
    <div><label>Cover <span class="zh">(英文封面标题)</span></label><input id="p_cover" value="${esc(v.cover)}"></div>
  </div>
  <label>内部脚本 <span class="zh">(中文 · 时间 | 画面 | 执行)</span></label>
  ${hasPlaceholder?'<div class="warn">当前为占位脚本。人工编辑并保存后,系统不会再自动覆盖。</div>':""}
  <div class="script-head"><span>时间</span><span>画面(中文)</span><span>执行说明(中文,可含英文字幕)</span><span></span></div>
  <div id="scriptRows">${(v.script||[]).map((r,i)=>scriptRowHtml(r,i)).join("")}</div>
  <button class="btn sm" onclick="addScriptRow()">+ 加一行</button>
  ${issues.length?`<div class="warn">${issues.map(esc).join("<br>")}</div>`:(v.script&&v.script.length?`<div class="okmsg">脚本完整性校验通过。</div>`:"")}
  <div class="grid2">
    <div><label>Caption <span class="zh">(英文)</span></label><textarea id="p_caption">${esc(v.caption)}</textarea></div>
    <div><label>CTA <span class="zh">(英文)</span></label><textarea id="p_cta" style="min-height:50px">${esc(v.cta)}</textarea></div>
  </div>
  <div class="savebar">
    <button class="btn primary" onclick="savePlatform('${p.id}','${plat}')">保存 ${plat} 版本</button>
    <select id="p_state" style="width:auto"><option ${v.state==="Planned"?"selected":""}>Planned</option><option ${v.state==="Draft"?"selected":""}>Draft</option></select>
    <button class="btn sm ghost" onclick="disablePlatform('${p.id}','${plat}')">停用此平台</button>
  </div>`;
  return html;
}
function scriptRowHtml(r,i){
  return `<div class="script-row" data-i="${i}">
    <input value="${esc(r[0])}" placeholder="0–3s">
    <input value="${esc(r[1])}" placeholder="画面">

  </div></div>`;

function parseAnalysis(text){
  const out = {analysisZh:"", publicCopy:{}, scripts:{}};
  const secs = text.split(/^#\s+/m).filter(Boolean);
  secs.forEach(sec=>{
    const firstLine = sec.split("\n")[0].trim();
    const body = sec.split("\n").slice(1).join("\n");
    if(/INTERNAL ANALYSIS/i.test(firstLine)) out.analysisZh = body.trim();
    else if(/PUBLIC COPY/i.test(firstLine)){
      body.split(/^##\s+/m).filter(Boolean).forEach(blk=>{
        const plat = blk.split("\n")[0].trim();
        if(!PLATFORMS.includes(plat)) return;
        const f = {};
        blk.split("\n").forEach(line=>{
          const m = line.match(/^(Content Title|Hook|Cover|Caption|CTA)\s*[::]\s*(.*)$/i);
          if(m) f[m[1].toLowerCase().replace(" ","")] = m[2].trim();
        });
        out.publicCopy[plat] = f;
      });
    }
    else if(/INTERNAL SCRIPT/i.test(firstLine)){
      body.split(/^##\s+/m).filter(Boolean).forEach(blk=>{
        const plat = blk.split("\n")[0].trim();
        if(!PLATFORMS.includes(plat)) return;
        const rows = [];
        blk.split("\n").forEach(line=>{
          const m = line.match(/^\s*[-•]\s*(.+)$/);
          if(!m) return;
          const parts = m[1].split("|").map(s=>s.trim());
          if(parts.length>=2){
            rows.push([parts[0], (parts[1]||"").replace(/^画面\s*[::]\s*/,""), (parts[2]||"").replace(/^执行\s*[::]\s*/,"")]);
          }
        });
        if(rows.length) out.scripts[plat] = rows;
      });
    }
  });
  return out;
}

}
function deletePub(id){
  askConfirm("删除发布记录", `删除 ${id}?对应内容项目的状态会重新按剩余发布记录计算。`, "删除", ()=>{
    DB.publications=DB.publications.filter(x=>x.id!==id);

  });
}
function deriveFromPub(pubId){
  const x = DB.publications.find(v=>v.id===pubId); if(!x) return;
  const src = getProject(x.contentId); if(!src){ toast("原项目不存在"); return; }
  const id = nextId(monthPrefix(DB.selectedMonth)+"-", DB.projects, 3);
  const copy = JSON.parse(JSON.stringify(src));
  copy.id=id; copy.month=DB.selectedMonth; copy.status="Brief"; copy.derivedFrom=pubId;
  copy.title = src.title + (x.nextAction==="改 hook 重发" ? " (New Hook)" : " (Rerun)");
  copy.briefZh = `由 ${x.contentId} · ${x.platform} 的复盘派生(${x.nextAction})。\n原学习:${x.learning}\n\n` + (copy.briefZh||"");
  DB.projects.push(copy);
  save(); openProject(id); toast(`已派生 ${id},脚本与文案已复制,请修改后重新走流程`);
}

/* ---- 学习沉淀 ---- */
function renderLearn(){

  }else{
    LEARN_TAGS.forEach(tag=>{

      if(!items.length) return;
      html += `<h3 class="serif" style="margin:14px 0 6px;font-size:16px">${esc(tag)} · ${items.length}</h3>`;
      items.forEach(x=>{
        const p=getProject(x.contentId);
        html += `<div class="learn-line"><span class="tag" style="background:${x.verdict==="超预期"?"var(--green)":x.verdict==="未达标"?"var(--red)":"var(--blue)"}">${esc(x.verdict||"?")}</span> ${esc(x.learning)} <span class="kv">— ${esc(x.contentId)} · ${esc(x.platform)}${p?" · "+esc(p.pillar):""}</span></div>`;

    });

    if(untagged.length){
      html += `<h3 class="serif" style="margin:14px 0 6px;font-size:16px">未打标签 · ${untagged.length}</h3>`;

}

/* ---- 素材库 ---- */
function renderAssets(){

  });

function newAsset(shootId){
  const id = nextId("SB-", DB.assets, 4);
  DB.assets.push({id,contentId:"",shootId:shootId||"",skuCodes:[],title:"New Asset",type:"Video master",driveUrl:"",notes:""});

}
function editAsset(id, field, val){
  const a=getAsset(id); if(!a) return;

}
function deleteAsset(id){

function projectFromAsset(aid){

  DB.projects.push({id,month:DB.selectedMonth,week:1,title:"Repurpose: "+a.title,pillar:PILLARS[0],goal:"Trust",status:"Idea",format:"",

    referenceIds:[],skuCodes:(a.skuCodes||[]).slice(),productNotes:"",dependencyType:"asset",shootId:"",assetIds:[a.id],needsFounder:false,derivedFrom:"",
    platforms:{TikTok:{state:"Planned",hook:"",cover:"",script:[],caption:"",cta:""},Instagram:{state:"Not Planned",hook:"",cover:"",script:[],caption:"",cta:""},Pinterest:{state:"Not Planned",hook:"",cover:"",script:[],caption:"",cta:""}},shotList:""});
  save(); openProject(id); toast(`已从 ${a.id} 派生新内容 ${id}(依赖已有素材,可直接剪辑)`);
}

<script>
"use strict";
/* ================= 产品拍摄 ================= */

function renderShootDetail(s){

    ${dependents.length?`<div class="notice"><b>${dependents.length} 条社媒内容依赖此拍摄:</b>${dependents.map(p=>`<div class="rel-item" onclick="openProject('${p.id}')"><span class="id serif" style="color:var(--rose)">${p.id}</span><span class="t">${esc(p.title)}</span>${stChip(p.status)}</div>`).join("")}${s.status!=="Delivered"?'<p class="kv" style="margin-top:6px">拍摄交付前,这些内容不会进入待拍摄/可剪辑队列。</p>':''}</div>`:""}`;

    ${(s.skuCodes||[]).some(isSample)?`<div class="warn">包含 Editorial Sample(非自动售卖)——仅用于品牌视觉,不进入 PDP 售卖流程。</div>`:""}
    ${TA("样品与现场备注(中文)","products","")}

function renderLookbookReferenceLibrary(s){

<script>
"use strict";
/* ================= 数据管理:导出 / 导入 / 备份 / 旧版迁移 ================= */
function openData(){
  const oldKeys = detectOldData();
  const hasBak = !!localStorage.getItem(LS_BAK);
  UI.modal = `<div class="modal-bg" onclick="if(event.target===this){UI.modal=null;render()}"><div class="modal">
    <h3>数据管理</h3>

    <p style="margin:8px 0"><button class="btn" onclick="restorePreservedSnapshot()">恢复迁移时完整快照</button> <span class="kv">7 条内容 · 6 条参考 · 17 个脚本版本 · 66 行脚本</span></p>
    <p style="margin:8px 0"><button class="btn" onclick="document.getElementById('importFile').click()">导入 JSON</button> <span class="kv">导入前会显示数据预览并要求确认</span></p>
    <p style="margin:8px 0"><button class="btn" ${hasBak?"":"disabled"} onclick="restoreBackup()">恢复上一次备份</button> <span class="kv">回到最近一次保存之前的状态</span></p>
    ${oldKeys.length?`<hr class="soft"><p class="kv"><b>检测到旧版系统数据</b>(${oldKeys.length} 个存储键)。可一次性迁移:goal 将按 Education→Trust、Consideration→Conversion 映射,ID 与关系保留。</p>

    <hr class="soft">
    <p style="margin:8px 0"><button class="btn danger" onclick="resetSeed()">重置为种子数据</button> <span class="kv">清空当前数据(会先自动留一份备份)</span></p>
    <div class="savebar"><button class="btn ghost" onclick="UI.modal=null;render()">关闭</button></div>
  </div></div>`;

}
function exportJson(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = `sovelle_os_export_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("已导出,请存到 Google Drive 备份");
}
function restorePreservedSnapshot(){
  askConfirm("恢复迁移时完整快照", "当前数据会先自动备份，然后恢复 7 条 Content、6 条 Reference 和 66 行脚本。", "恢复", ()=>{
    localStorage.setItem(LS_BAK, JSON.stringify(DB));
    DB = preservedData();
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    localStorage.setItem(PRESERVED_IMPORT_KEY, JSON.stringify({restoredAt:new Date().toISOString(),sourceGeneratedAt:DB.migrationGeneratedAt||""}));
    UI.modal=null; syncAllProjectStatuses(false); render(); toast("完整迁移快照已恢复");
  });
}
document.getElementById("importFile").addEventListener("change", function(){
  const f = this.files[0]; this.value="";
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let obj;
    try{ obj = JSON.parse(rd.result); }catch(e){ toast("文件不是有效 JSON"); return; }
    const errs = validateImport(obj);
    const counts = `内容 ${obj.projects?obj.projects.length:0} · 参考 ${obj.references?obj.references.length:0} · SKU ${obj.skus?obj.skus.length:0} · 拍摄 ${obj.shoots?obj.shoots.length:0} · 素材 ${obj.assets?obj.assets.length:0} · 发布 ${obj.publications?obj.publications.length:0}`;
    UI.modal = `<div class="modal-bg"><div class="modal"><h3>导入预览</h3>
      <p class="kv">${counts}</p>
      ${errs.length?`<div class="warn">${errs.map(esc).join("<br>")}</div>`:'<div class="okmsg">结构校验通过,ID 与关系完整。</div>'}
      <p class="kv" style="margin-top:8px">导入将替换当前全部数据(当前数据会先存入备份,可恢复)。</p>
      <div class="savebar">
        <button class="btn primary" ${errs.some(e=>e.startsWith("致命"))?"disabled":""} onclick='confirmImport(${JSON.stringify(JSON.stringify(obj))})'>确认导入</button>
        <button class="btn ghost" onclick="UI.modal=null;render()">取消</button>
      </div></div></div>`;
    render();
  };
  rd.readAsText(f);
});
function validateImport(obj){
  const errs = [];
  if(!obj || typeof obj!=="object") return ["致命:不是有效的数据对象。"];
  ["projects","skus","references","shoots","assets","publications"].forEach(k=>{
    if(!Array.isArray(obj[k])) errs.push(`致命:缺少 ${k} 数组。`);
  });
  if(errs.length) return errs;
  const pids = new Set(obj.projects.map(p=>p.id));
  if(pids.size !== obj.projects.length) errs.push("致命:存在重复的 Content ID。");
  obj.publications.forEach(x=>{ if(!pids.has(x.contentId)) errs.push(`发布记录 ${x.id} 指向不存在的内容 ${x.contentId}。`); });
  obj.assets.forEach(a=>{ if(a.contentId && !pids.has(a.contentId)) errs.push(`素材 ${a.id} 指向不存在的内容 ${a.contentId}。`); });
  return errs;
}
function confirmImport(jsonStr){
  localStorage.setItem(LS_BAK, JSON.stringify(DB));
  DB = JSON.parse(jsonStr);
  if(!DB.months) DB.months=["2026-07","2026-08"];
  if(!DB.selectedMonth) DB.selectedMonth=DB.months[0];
  UI.modal=null; syncAllProjectStatuses(false);
  localStorage.setItem(LS_KEY, JSON.stringify(DB));
  render(); toast("导入完成");
}
function restoreBackup(){
  const bak = localStorage.getItem(LS_BAK);
  if(!bak){ toast("没有可用备份"); return; }
  askConfirm("恢复上一次备份", "当前数据会与备份互换,再次点击可换回。", "恢复", ()=>{
    const cur = JSON.stringify(DB);
    DB = JSON.parse(bak);
    localStorage.setItem(LS_BAK, cur);
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    UI.modal=null; render(); toast("已恢复备份");
  });
}
function resetSeed(){

    localStorage.setItem(LS_BAK, JSON.stringify(DB));
    DB = seedData();
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    UI.modal=null; render(); toast("已重置");

}

const OLD_KEYS = ["sovelle_mvp_contents_v3_calily","sovelle_studio_drafts_v1","sovelle_reference_inbox_v1","sovelle_sku_directory_v1","sovelle_product_shoot_library_v1","sovelle_deleted_studio_ids_v1"];

const OLD_STATUS_MAP = {"Brief":"Brief","Planned":"Brief","Shot":"Shot","Editing":"Editing","Review":"Editing","Approved":"Approved"};
function migrateOld(){
  try{
    localStorage.setItem(LS_BAK, JSON.stringify(DB));
    let migrated = {projects:0, refs:0, skus:0, shoots:0, scripts:0};
    const oldContents = JSON.parse(localStorage.getItem("sovelle_mvp_contents_v3_calily")||"[]");
    const oldDrafts = JSON.parse(localStorage.getItem("sovelle_studio_drafts_v1")||"{}");

    const deletedIds = new Set(JSON.parse(localStorage.getItem("sovelle_deleted_studio_ids_v1")||"[]"));
    const knownSkuCodes = new Set(DB.skus.map(s=>s.code));
    if(Array.isArray(oldContents)){
      oldContents.forEach(c=>{
        if(!c || !c.id || deletedIds.has(c.id)) return;
        const draft = oldDrafts[c.id] || {};
        const existing = getProject(c.id);
        const platforms = {};
        PLATFORMS.forEach(pl=>{
          const key = pl.toLowerCase();
          const prior = existing && existing.platforms && existing.platforms[pl] || {};
          const d = draft.platforms && draft.platforms[pl] || draft[pl] || draft[key] || {};
          const script = Array.isArray(d.script)&&d.script.length ? d.script : (Array.isArray(prior.script)?prior.script:[]);
          if(script.length) migrated.scripts++;
          platforms[pl] = {state:d.state||prior.state||"Not Planned",hook:d.hook||prior.hook||"",cover:d.cover||prior.cover||"",caption:d.caption||prior.caption||"",cta:d.cta||prior.cta||"",script};
        });
        const selectedSkus = Array.isArray(draft.selectedSkus)?draft.selectedSkus:(Array.isArray(draft.skuCodes)?draft.skuCodes:(Array.isArray(c.skuCodes)?c.skuCodes:[]));
        const inferredSkus = Array.from(knownSkuCodes).filter(code=>new RegExp("(^|[^A-Z0-9])"+code+"([^A-Z0-9]|$)","i").test(String(draft.sku||c.sku||"")));
        const referenceIds = Array.isArray(oldRefs)?oldRefs.filter(r=>(r.contentId||r.linkedContentId)===c.id).map(r=>r.id):(existing?.referenceIds||[]);
        let status=OLD_STATUS_MAP[c.status]||existing?.status||"Brief";
        if(Object.values(platforms).some(v=>v.script.length)&&stIdx(status)<2)status="Scripted";
        const next = {
          id:c.id, month:c.month||"2026-07",
          week:parseInt(String(c.week||"1").replace(/\D/g,""),10)||1,
          title:draft.title||c.title||existing?.title||c.id,
          pillar:PILLARS.includes(c.pillar)?c.pillar:(PILLARS.includes(draft.role)?draft.role:(existing?.pillar||PILLARS[0])),
          goal:GOAL_MAP[c.goal]||GOAL_MAP[draft.goal]||existing?.goal||"Trust", status,
          format:c.format||existing?.format||"", briefZh:draft.summary||draft.briefZh||draft.brief||c.question||existing?.briefZh||"",
          referenceIds:referenceIds.length?referenceIds:(existing?.referenceIds||[]), skuCodes:Array.from(new Set(selectedSkus.concat(inferredSkus))),
          productNotes:[draft.product,draft.productionNotes,draft.productNotes].filter(Boolean).join("\n")||existing?.productNotes||"",
          dependencyType:existing?.dependencyType||"independent", shootId:existing?.shootId||"", assetIds:existing?.assetIds||[],
          needsFounder:existing?.needsFounder||/founder|started sovelle/i.test(String(draft.title||c.title||"")), derivedFrom:existing?.derivedFrom||"",
          platforms, shotList:Array.isArray(draft.shots)?draft.shots.join("\n"):(draft.shotList||existing?.shotList||"")
        };
        const idx=DB.projects.findIndex(p=>p.id===c.id);
        if(idx>=0)DB.projects[idx]=next;else DB.projects.push(next);
        migrated.projects++;
      });
    }
    if(Array.isArray(oldRefs)){
      oldRefs.forEach(r=>{
        if(!r || !r.id) return;
        const linkedContentId=r.contentId||r.linkedContentId||"",existing=DB.references.find(x=>x.id===r.id);
        const next={id:r.id,platform:r.platform||existing?.platform||"TikTok",brand:r.brand||existing?.brand||"",url:r.url||existing?.url||"",topicZh:r.topic||r.topicZh||existing?.topicZh||"",note:[r.note,r.summary,Array.isArray(r.why)?r.why.join("\n"):"",r.borrow,r.avoid,r.transform].filter(Boolean).join("\n\n")||existing?.note||"",status:linkedContentId?"linked":(r.status||existing?.status||"inbox"),analysisRaw:r.analysisText||r.analysisRaw||r.analysis||existing?.analysisRaw||"",parsed:existing?.parsed||null,linkedContentId};
        const idx=DB.references.findIndex(x=>x.id===r.id);if(idx>=0)DB.references[idx]=next;else DB.references.push(next);
        migrated.refs++;
      });
    }
    const oldSkus = JSON.parse(localStorage.getItem("sovelle_sku_directory_v1")||"[]");
    if(Array.isArray(oldSkus)){
      oldSkus.forEach(s=>{
        if(!s || !s.code) return;
        const ex = getSku(s.code);
        if(ex)Object.assign(ex,{name:s.name||ex.name,group:s.group||ex.group,launchStatus:s.status||s.launchStatus||ex.launchStatus,role:s.role||ex.role,contentJob:s.contentJob||ex.contentJob,notes:s.notes||ex.notes});
        else DB.skus.push({code:s.code,name:s.name||s.code,group:s.group||"Veil",launchStatus:s.status||s.launchStatus||"",role:s.role||"",contentJob:s.contentJob||"",notes:s.notes||""});
        migrated.skus++;
      });
    }
    const oldShoots = JSON.parse(localStorage.getItem("sovelle_product_shoot_library_v1")||"[]");
    if(Array.isArray(oldShoots)){
      oldShoots.forEach(s=>{
        if(!s || !s.id) return;
        const next=Object.assign({id:s.id,title:"",date:"",status:"Planning",type:SHOOT_TYPES[0],collection:"",location:"",photographer:"",team:"",drive:"",summary:"",skuCodes:[],products:"",looks:"",references:"",referenceNotes:"",shots:"",deliverables:"",checklist:"",notes:""},s,{date:s.shootDate||s.date||"",skuCodes:Array.isArray(s.selectedSkus)?s.selectedSkus:(s.skuCodes||[])});
        const idx=DB.shoots.findIndex(x=>x.id===s.id);if(idx>=0)DB.shoots[idx]=next;else DB.shoots.push(next);
        migrated.shoots++;
      });
    }
    normalizeShootReferenceLibraries(DB);
    syncAllProjectStatuses(false); save();
    UI.modal=null; render();
    toast(`迁移完成:内容 ${migrated.projects} · 脚本版本 ${migrated.scripts} · 参考 ${migrated.refs} · SKU ${migrated.skus} · 拍摄 ${migrated.shoots}`);
  }catch(e){
    toast("迁移遇到问题,数据未受影响,可从备份恢复");
  }
}

/* ================= 启动 ================= */
load();
render();
</script>
